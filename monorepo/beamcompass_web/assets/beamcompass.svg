<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer Hexagon Clip Path -->
    <clipPath id="hexClip">
      <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" />
    </clipPath>

    <!-- Background Void Gradient -->
    <radialGradient id="bgGlow" cx="100" cy="100" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181336" />
      <stop offset="50%" stop-color="#0c0a1f" />
      <stop offset="100%" stop-color="#05040a" />
    </radialGradient>

    <!-- Metallic / Energy Hex Rim Gradient -->
    <linearGradient id="hexRimGrad" x1="16.86" y1="4" x2="183.14" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="28%" stop-color="#7928ca" />
      <stop offset="70%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>

    <!-- Vertical BEAM Light Ray Gradient -->
    <linearGradient id="verticalBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.8" />
      <stop offset="15%" stop-color="#00f5ff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.1" />
      <stop offset="85%" stop-color="#ff007a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0.8" />
    </linearGradient>

    <!-- Compass Needle Shading (North: Light / Dark) -->
    <linearGradient id="needleNorthLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="needleNorthDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="55%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Compass Needle Shading (South: Light / Dark) -->
    <linearGradient id="needleSouthLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="needleSouthDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <!-- Compass Needle Shading (East / West) -->
    <linearGradient id="needleEastLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="needleEastDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="needleWestLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="needleWestDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Central Lens & Jewel Radiance -->
    <radialGradient id="centerJewel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#0c0a1f" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="intenseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- CONTENT CLIPPED STRICTLY TO HEXAGON -->
  <g clip-path="url(#hexClip)">
    <!-- Deep Space Hexagonal Background -->
    <rect x="0" y="0" width="200" height="200" fill="url(#bgGlow)" />

    <!-- Isometric Tripartite Coordinate Grid Lines -->
    <g stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.18">
      <line x1="100" y1="4" x2="100" y2="196" />
      <line x1="16.86" y1="52" x2="183.14" y2="148" />
      <line x1="16.86" y1="148" x2="183.14" y2="52" />
      <line x1="100" y1="4" x2="183.14" y2="148" stroke-dasharray="2,4" />
      <line x1="100" y1="4" x2="16.86" y2="148" stroke-dasharray="2,4" />
      <line x1="100" y1="196" x2="183.14" y2="52" stroke-dasharray="2,4" />
      <line x1="100" y1="196" x2="16.86" y2="52" stroke-dasharray="2,4" />
    </g>

    <!-- OTP Causal Node & Boundary Graph Lattice (Triggers, StateHolders, Effects) -->
    <g fill="none" stroke-linecap="round">
      <!-- Causal Arcs -->
      <path d="M 52,68 Q 72,42 128,52" stroke="#00f5ff" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="3,3" />
      <path d="M 128,52 Q 164,80 152,130" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.4" />
      <path d="M 152,130 Q 112,168 64,142" stroke="#ff007a" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="4,2" />
      <path d="M 64,142 Q 34,104 52,68" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
      <path d="M 52,68 Q 95,90 152,130" stroke="#ffb703" stroke-width="0.6" stroke-opacity="0.3" />

      <!-- Graph Constellation Nodes -->
      <circle cx="52" cy="68" r="2.2" fill="#00f5ff" filter="url(#intenseGlow)" />
      <circle cx="128" cy="52" r="2" fill="#a855f7" />
      <circle cx="152" cy="130" r="2.5" fill="#ff007a" filter="url(#intenseGlow)" />
      <circle cx="64" cy="142" r="2" fill="#ffb703" />
      <circle cx="100" cy="46" r="1.5" fill="#38bdf8" />
      <circle cx="146" cy="85" r="1.5" fill="#c084fc" />
      <circle cx="82" cy="154" r="1.5" fill="#fb7185" />
    </g>

    <!-- The 3 Semantic Lenses: Behavior, Effects, State (Rotated Interlocking Orbits) -->
    <g fill="none" stroke-width="0.8" opacity="0.65">
      <!-- Lens 1: Behavior (Cyan Orbit, -30°) -->
      <ellipse cx="100" cy="100" rx="76" ry="24" transform="rotate(-30 100 100)" stroke="#00f5ff" stroke-dasharray="16 3 2 3" />
      <!-- Lens 2: Effects (Magenta/Violet Orbit, +30°) -->
      <ellipse cx="100" cy="100" rx="76" ry="24" transform="rotate(30 100 100)" stroke="#f43f5e" stroke-dasharray="16 3 2 3" />
      <!-- Lens 3: State (Gold/Amber Orbit, 90°) -->
      <ellipse cx="100" cy="100" rx="76" ry="24" transform="rotate(90 100 100)" stroke="#ffb703" stroke-dasharray="16 3 2 3" />
    </g>

    <!-- Astrolabe Range Rings & Compass Reticle Dial -->
    <g fill="none" stroke="#67e8f9" stroke-opacity="0.3">
      <circle cx="100" cy="100" r="68" stroke-width="0.75" />
      <circle cx="100" cy="100" r="54" stroke-width="0.5" stroke-dasharray="2, 4" />
      <circle cx="100" cy="100" r="38" stroke-width="0.75" stroke-opacity="0.5" />
    </g>

    <!-- Azimuth Tick Marks Around Perimeter Dial -->
    <g stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.5">
      <!-- Cardinal and Intermediate Degree Rays -->
      <line x1="100" y1="34" x2="100" y2="39" />
      <line x1="100" y1="161" x2="100" y2="166" />
      <line x1="34" y1="100" x2="39" y2="100" />
      <line x1="161" y1="100" x2="166" y2="100" />
      <line x1="53.33" y1="53.33" x2="57.57" y2="57.57" />
      <line x1="146.67" y1="53.33" x2="142.43" y2="57.57" />
      <line x1="53.33" y1="146.67" x2="57.57" y2="142.43" />
      <line x1="146.67" y1="146.67" x2="142.43" y2="142.43" />
    </g>

    <!-- Coherent Vertical BEAM of Light -->
    <polygon points="98.2,4 101.8,4 103.5,196 96.5,196" fill="url(#verticalBeam)" filter="url(#intenseGlow)" />

    <!-- 8-Point Astrolabe Compass Rose -->
    <!-- Secondary (Ordinal) Points (NE, SE, SW, NW) -->
    <g filter="url(#softGlow)" opacity="0.9">
      <!-- North-East -->
      <polygon points="100,100 102,94 136,64 100,100" fill="#a855f7" />
      <polygon points="100,100 94,98 136,64 100,100" fill="#3b0764" />
      <!-- South-East -->
      <polygon points="100,100 98,102 136,136 100,100" fill="#f43f5e" />
      <polygon points="100,100 102,96 136,136 100,100" fill="#881337" />
      <!-- South-West -->
      <polygon points="100,100 98,104 64,136 100,100" fill="#fbbf24" />
      <polygon points="100,100 104,102 64,136 100,100" fill="#78350f" />
      <!-- North-West -->
      <polygon points="100,100 96,98 64,64 100,100" fill="#38bdf8" />
      <polygon points="100,100 102,94 64,64 100,100" fill="#0c4a6e" />
    </g>

    <!-- Primary Cardinal Needles (Faceted 3D Compass Blades) -->
    <!-- West Needle -->
    <polygon points="100,100 94,94 34,100" fill="url(#needleWestLight)" />
    <polygon points="100,100 94,106 34,100" fill="url(#needleWestDark)" />
    <!-- East Needle -->
    <polygon points="100,100 106,94 166,100" fill="url(#needleEastLight)" />
    <polygon points="100,100 106,106 166,100" fill="url(#needleEastDark)" />
    <!-- South Needle -->
    <polygon points="100,100 94,106 100,166" fill="url(#needleSouthLight)" />
    <polygon points="100,100 106,106 100,166" fill="url(#needleSouthDark)" />
    <!-- North Needle (Major Hero Pointer - Navigational Zenith) -->
    <polygon points="100,100 93.5,94 100,20" fill="url(#needleNorthLight)" filter="url(#intenseGlow)" />
    <polygon points="100,100 106.5,94 100,20" fill="url(#needleNorthDark)" />
    <!-- North Needle Spine Ridge Highlight -->
    <line x1="100" y1="20" x2="100" y2="100" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />

    <!-- Central Zoom Aperture / Lens Core -->
    <!-- Mechanical Outer Collar -->
    <circle cx="100" cy="100" r="24" fill="#070614" stroke="#ffb703" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="100" cy="100" r="21" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="1.5, 3" />

    <!-- 6-Blade Hexagonal Camera Iris (Aperture of the Operational Atlas) -->
    <g fill="#161233" stroke="#00f5ff" stroke-width="0.6" stroke-opacity="0.5">
      <polygon points="100,79 114,84 106,95" fill="#1e1847" />
      <polygon points="118,89 121,104 108,103" fill="#261e5a" />
      <polygon points="118,111 107,121 102,109" fill="#1e1847" />
      <polygon points="100,121 86,116 94,105" fill="#261e5a" />
      <polygon points="82,111 79,96 92,97" fill="#1e1847" />
      <polygon points="82,89 93,79 98,91" fill="#261e5a" />
    </g>

    <!-- Internal Focus Ring -->
    <circle cx="100" cy="100" r="11" fill="url(#centerJewel)" />
    <circle cx="100" cy="100" r="11" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.7" />

    <!-- Glowing Singular Pivot Node (Question Origin) -->
    <circle cx="100" cy="100" r="4.5" fill="#00f5ff" filter="url(#intenseGlow)" />
    <circle cx="100" cy="100" r="2" fill="#ffffff" />

    <!-- Horizontal Anamorphic Lens Flare Across Focal Point -->
    <ellipse cx="100" cy="100" rx="34" ry="1.2" fill="#e0f2fe" opacity="0.85" filter="url(#intenseGlow)" />
    <ellipse cx="100" cy="100" rx="14" ry="2" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- PRECISION OUTER HEXAGONAL FRAME & CASING -->
  <!-- Subtle Inset Neon Guideline -->
  <polygon points="100,8.5 179.24,54.25 179.24,145.75 100,191.5 20.76,145.75 20.76,54.25"
           fill="none" stroke="#00f5ff" stroke-width="0.75" stroke-dasharray="14, 4, 3, 4" stroke-opacity="0.6" />

  <!-- Master Outer Hexagon Structural Rim -->
  <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52"
           fill="none" stroke="url(#hexRimGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Precision Corner Vertex Nodes (Hardware Fasteners / Navigational Anchors) -->
  <g fill="#0c0a1f" stroke="#00f5ff" stroke-width="1.2">
    <!-- Top -->
    <circle cx="100" cy="4" r="2.8" stroke="#00f5ff" fill="#00f5ff" />
    <!-- Top-Right -->
    <circle cx="183.14" cy="52" r="2.5" stroke="#7928ca" />
    <!-- Bottom-Right -->
    <circle cx="183.14" cy="148" r="2.5" stroke="#ff007a" />
    <!-- Bottom -->
    <circle cx="100" cy="196" r="2.8" stroke="#ffb703" fill="#ffb703" />
    <!-- Bottom-Left -->
    <circle cx="16.86" cy="148" r="2.5" stroke="#ff007a" />
    <!-- Top-Left -->
    <circle cx="16.86" cy="52" r="2.5" stroke="#7928ca" />
  </g>
</svg>
