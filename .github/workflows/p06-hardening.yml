name: P06 source-hardened build (NOT full release qualification)
on:
  pull_request:
    paths:
      - 'monorepo/**'
      - 'scripts/p06*'
      - 'scripts/tests/**'
      - '.github/workflows/p06-hardening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-source-only-subset:
    # This is explicitly NOT a full P06 release gate. The separately tracked
    # parent-docset, corpus/provenance, owner budgets and recovery cannot be
    # asserted in this source-only checkout. No synthetic approvals.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.5'
          otp-version: '29.1.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mandatory Mix gates in BOTH trusted apps
        shell: bash
        run: |
          set -euo pipefail
          for app in monorepo/beamcompass_core monorepo/beamcompass_web; do
            (cd "$app" && mix deps.get && mix format --check-formatted && mix compile --warnings-as-errors && mix test && mix credo --strict && mix dialyzer && mix docs)
          done
      - name: Actual TypeScript dependency install, check and build
        working-directory: monorepo/beamcompass_web/assets
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - name: Source-only deterministic package, test and negative inputs
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
          python3 scripts/p06_release.py --source-root . --check-reproducible
      - name: State limits and parent-docset release dependencies explicitly
        run: |
          echo 'PASS here is ONLY a source CI subset, NOT full P06 release qualification.'
          echo 'B must run scripts/verify_p06.sh with the user-committed parent docset and real approved scale/recovery inputs.'
