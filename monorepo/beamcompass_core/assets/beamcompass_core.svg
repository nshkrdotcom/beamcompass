<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer Hexagon Clip Path: 4px padding top and bottom -->
    <clipPath id="coreHexClip">
      <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" />
    </clipPath>

    <!-- Deep Space Void Gradient -->
    <radialGradient id="coreBg" cx="100" cy="100" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181138" />
      <stop offset="45%" stop-color="#0c0822" />
      <stop offset="85%" stop-color="#050310" />
      <stop offset="100%" stop-color="#020106" />
    </radialGradient>

    <!-- Metallic / Energy Hex Rim Gradient -->
    <linearGradient id="coreRim" x1="16.86" y1="4" x2="183.14" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="28%" stop-color="#7928ca" />
      <stop offset="70%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>

    <!-- Vertical BEAM Light Ray Gradient -->
    <linearGradient id="beamRay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0.8" />
    </linearGradient>

    <!-- Compass Needle Shading (North: Light / Dark) -->
    <linearGradient id="needleNorthLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="needleNorthDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="55%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Compass Needle Shading (South: Light / Dark) -->
    <linearGradient id="needleSouthLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="needleSouthDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <!-- Compass Needle Shading (East / West) -->
    <linearGradient id="needleEastLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="needleEastDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="needleWestLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="needleWestDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Caliper Arms Gradient -->
    <linearGradient id="caliperSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Center Core Jewel -->
    <radialGradient id="centerJewel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#0c0a1f" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="intenseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 80% Grayscale Filter (keeping 20% color blend) -->
    <filter id="grayscale80" x="0%" y="0%" width="100%" height="100%">
      <feColorMatrix type="saturate" values="0.2" />
    </filter>
  </defs>

  <!-- CONTENT CLIPPED STRICTLY TO HEXAGON -->
  <g clip-path="url(#coreHexClip)">
    <g filter="url(#grayscale80)">
    <!-- Base Void Background -->
    <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" fill="url(#coreBg)" />

    <!-- Isometric AST Coordinate Grid Web -->
    <g stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.2">
      <line x1="100" y1="4" x2="100" y2="196" />
      <line x1="16.86" y1="52" x2="183.14" y2="148" />
      <line x1="16.86" y1="148" x2="183.14" y2="52" />
      <line x1="100" y1="4" x2="183.14" y2="148" stroke-dasharray="2,4" />
      <line x1="100" y1="4" x2="16.86" y2="148" stroke-dasharray="2,4" />
      <line x1="100" y1="196" x2="183.14" y2="52" stroke-dasharray="2,4" />
      <line x1="100" y1="196" x2="16.86" y2="52" stroke-dasharray="2,4" />
    </g>

    <!-- Concentric Coordinate Astrolabe Rings -->
    <circle cx="100" cy="100" r="76" fill="none" stroke="#7928ca" stroke-width="0.75" stroke-dasharray="3,6" stroke-opacity="0.35" />
    <circle cx="100" cy="100" r="62" fill="none" stroke="#00f5ff" stroke-width="0.8" stroke-opacity="0.3" />
    <circle cx="100" cy="100" r="42" fill="none" stroke="#ff007a" stroke-width="0.75" stroke-dasharray="2,4" stroke-opacity="0.35" />

    <!-- Coherent Vertical BEAM of Light -->
    <polygon points="98,4 102,4 104,196 96,196" fill="url(#beamRay)" filter="url(#intenseGlow)" />

    <!-- AST Fact Nodes (Processes, Effects, Intent Capsules, Channels) -->
    <!-- Process Node (North-West) -->
    <circle cx="58" cy="62" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="0.8" filter="url(#intenseGlow)" />
    <!-- Effect Site Node (North-East) -->
    <circle cx="142" cy="62" r="3.5" fill="#ff007a" stroke="#ffffff" stroke-width="0.8" filter="url(#intenseGlow)" />
    <!-- Channel / Message Node (South-East) -->
    <circle cx="146" cy="136" r="3.5" fill="#ffb703" stroke="#ffffff" stroke-width="0.8" filter="url(#intenseGlow)" />
    <!-- Handler Capsule Node (South-West) -->
    <circle cx="54" cy="136" r="3.5" fill="#a855f7" stroke="#ffffff" stroke-width="0.8" filter="url(#intenseGlow)" />

    <!-- AST Interconnection Vector Lines -->
    <g stroke="#67e8f9" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.45">
      <line x1="58" y1="62" x2="100" y2="100" />
      <line x1="142" y1="62" x2="100" y2="100" />
      <line x1="146" y1="136" x2="100" y2="100" />
      <line x1="54" y1="136" x2="100" y2="100" />
      <line x1="58" y1="62" x2="142" y2="62" />
      <line x1="142" y1="62" x2="146" y2="136" />
    </g>

    <!-- Source Coordinate Indicators (Start line/column brackets) -->
    <g stroke="#00f5ff" stroke-width="0.9" fill="none" opacity="0.75">
      <path d="M 52,56 L 48,56 L 48,68 L 52,68" />
      <path d="M 148,56 L 152,56 L 152,68 L 148,68" />
    </g>

    <!-- Caliper Arms Measuring AST Spans -->
    <g filter="url(#softGlow)" opacity="0.85">
      <polygon points="98,96 100,92 68,44 65,47" fill="url(#caliperSteel)" />
      <polygon points="102,96 100,92 132,44 135,47" fill="url(#caliperSteel)" />
      <path d="M 70,50 A 42,42 0 0,1 130,50" fill="none" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="2,3" />
    </g>

    <!-- 8-Point Faceted Compass Rose (Core Navigational Instrument) -->
    <!-- Secondary Ordinal Points -->
    <g filter="url(#softGlow)" opacity="0.85">
      <polygon points="100,100 102,94 134,66 100,100" fill="#a855f7" />
      <polygon points="100,100 94,98 134,66 100,100" fill="#3b0764" />
      <polygon points="100,100 98,102 134,134 100,100" fill="#f43f5e" />
      <polygon points="100,100 102,96 134,134 100,100" fill="#881337" />
      <polygon points="100,100 98,104 66,134 100,100" fill="#fbbf24" />
      <polygon points="100,100 104,102 66,134 100,100" fill="#78350f" />
      <polygon points="100,100 96,98 66,66 100,100" fill="#38bdf8" />
      <polygon points="100,100 102,94 66,66 100,100" fill="#0c4a6e" />
    </g>

    <!-- Primary Cardinal Needles -->
    <!-- West Needle -->
    <polygon points="100,100 94,94 36,100" fill="url(#needleWestLight)" />
    <polygon points="100,100 94,106 36,100" fill="url(#needleWestDark)" />
    <!-- East Needle -->
    <polygon points="100,100 106,94 164,100" fill="url(#needleEastLight)" />
    <polygon points="100,100 106,106 164,100" fill="url(#needleEastDark)" />
    <!-- South Needle -->
    <polygon points="100,100 94,106 100,164" fill="url(#needleSouthLight)" />
    <polygon points="100,100 106,106 100,164" fill="url(#needleSouthDark)" />
    <!-- North Needle (Major Hero Pointer) -->
    <polygon points="100,100 93.5,94 100,22" fill="url(#needleNorthLight)" filter="url(#intenseGlow)" />
    <polygon points="100,100 106.5,94 100,22" fill="url(#needleNorthDark)" />
    <line x1="100" y1="22" x2="100" y2="100" stroke="#ffffff" stroke-width="0.8" opacity="0.85" />

    <!-- Central Lens & Camera Aperture Core -->
    <circle cx="100" cy="100" r="23" fill="#070614" stroke="#ffb703" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="100" cy="100" r="20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="1.5, 3" />

    <!-- 6-Blade Camera Iris -->
    <g fill="#161233" stroke="#00f5ff" stroke-width="0.6" stroke-opacity="0.5">
      <polygon points="100,80 113,85 106,95" fill="#1e1847" />
      <polygon points="117,90 120,104 107,103" fill="#261e5a" />
      <polygon points="117,110 106,120 101,109" fill="#1e1847" />
      <polygon points="100,120 87,115 94,105" fill="#261e5a" />
      <polygon points="83,110 80,96 93,97" fill="#1e1847" />
      <polygon points="83,90 94,80 99,91" fill="#261e5a" />
    </g>

    <!-- Focal Point Jewel & Anamorphic Flare -->
    <circle cx="100" cy="100" r="10.5" fill="url(#centerJewel)" />
    <circle cx="100" cy="100" r="4" fill="#00f5ff" filter="url(#intenseGlow)" />
    <circle cx="100" cy="100" r="1.8" fill="#ffffff" />
    <ellipse cx="100" cy="100" rx="32" ry="1.2" fill="#e0f2fe" opacity="0.85" filter="url(#intenseGlow)" />

    <!-- Polished Inner Bezel Guideline -->
    <polygon points="100,7 180.54,53.5 180.54,146.5 100,193 19.46,146.5 19.46,53.5"
             fill="none" stroke="#00f5ff" stroke-width="0.75" stroke-dasharray="12, 4" stroke-opacity="0.5" />

    <!-- Master Outer Hexagon Structural Rim -->
    <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52"
             fill="none" stroke="url(#coreRim)" stroke-width="2.6" stroke-linejoin="round" />

    <!-- Corner Hardware Fasteners / Calibration Nodes -->
    <g fill="#0c0a1f" stroke="#00f5ff" stroke-width="1.2">
      <circle cx="100" cy="4" r="2.8" stroke="#00f5ff" fill="#00f5ff" />
      <circle cx="183.14" cy="52" r="2.5" stroke="#7928ca" />
      <circle cx="183.14" cy="148" r="2.5" stroke="#ff007a" />
      <circle cx="100" cy="196" r="2.8" stroke="#ffb703" fill="#ffb703" />
      <circle cx="16.86" cy="148" r="2.5" stroke="#ff007a" />
      <circle cx="16.86" cy="52" r="2.5" stroke="#7928ca" />
    </g>
    </g>
  </g>
</svg>