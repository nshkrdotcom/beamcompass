name: P05 standalone navigator and headless parity
on:
  pull_request:
    paths:
      - 'monorepo/beamcompass_core/**'
      - 'monorepo/beamcompass_web/**'
      - 'scripts/verify_p05.sh'
      - '.github/workflows/p05-navigator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-p05-source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.5'
          otp-version: '29.1.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trusted scanner and headless/browser toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium python3-pip
          python3 -m pip install --user --break-system-packages playwright jsonschema referencing
      - name: P05 trusted-app CI (separate parent docset remains an independent release gate)
        env:
          P05_SOURCE_CI_ONLY: '1'
          P05_LOG_ROOT: /tmp/p05-ci-evidence
        run: sh scripts/verify_p05.sh
      - name: Upload real CI logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beamcompass-p05-ci-logs
          path: /tmp/p05-ci-evidence/
          if-no-files-found: warn
